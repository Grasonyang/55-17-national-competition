<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <input type="number">
    <button onclick="draw()">Draw</button>
    <canvas height="500" width="500"></canvas>
    <script src="./jquery.min.js"></script>
</body>
<script>
    let basic = [
        [
            {
                x:250,
                y:0,
            },{
                x:0,
                y:500,
            },{
                x:500,
                y:500,
            }
        ]
    ]
    function draw(){
        basic = [
            [
                {
                    x:250,
                    y:0,
                },{
                    x:0,
                    y:500,
                },{
                    x:500,
                    y:500,
                }
            ]
        ];
        getPoint($("input").val()-1);
        let ctx = $("canvas")[0].getContext('2d');
        ctx.clearRect(0,0,500,500);
        for(let i=0;i<basic.length;i++){
            let p = basic[i];
            let p1 = p[0];
            let p2 = p[1];
            let p3 = p[2];
            ctx.beginPath();
            ctx.moveTo(p1.x, p1.y);
            ctx.lineTo(p2.x, p2.y);
            ctx.lineTo(p3.x, p3.y);
            ctx.fillStyle="black";
            ctx.fill();
            ctx.closePath();
        }
    }
    function getPoint(num){
        if(num<=0){
            return ;
        }
        let newBasic = [];
        for(let i=0;i<basic.length;i++){
            let p = basic[i];
            let p1 = p[0];
            let p2 = p[1];
            let p3 = p[2];
            let mid1 = {
                x: (p1.x+p2.x)/2,
                y: (p1.y+p2.y)/2,
            }
            let mid2 = {
                x: (p3.x+p2.x)/2,
                y: (p3.y+p2.y)/2,
            }
            let mid3 = {
                x: (p1.x+p3.x)/2,
                y: (p1.y+p3.y)/2,
            }
            newBasic.push([
                p1, mid1, mid3
            ])
            newBasic.push([
                p2, mid1, mid2
            ])
            newBasic.push([
                p3, mid2, mid3
            ])
        }
        basic = newBasic;
        getPoint(num-1);
    }
</script>
</html>
